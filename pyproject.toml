[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gate-forecasting"
version = "0.1.0"
description = "GATE CSE Exam Pattern Forecasting System"
authors = [
    {name = "Developer"}
]
requires-python = ">=3.10"
dependencies = [
    "PyMuPDF>=1.23.0",
    "pdfplumber>=0.10.0",
    "pytesseract>=0.3.10",
    "Pillow>=10.0.0",
    "requests>=2.31.0",
    "tqdm>=4.65.0",
    "click>=8.1.0",
    "python-dateutil>=2.8.0"
]
